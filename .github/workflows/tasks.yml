name: PHP Composer

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: "php: ${{ matrix.php }} TYPO3: ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        php: [ '82', '83', '84', '85' ]
        typo3: [ '14' ]
    container:
      image: ghcr.io/typo3/core-testing-php${{ matrix.php }}:latest
    steps:
      - name: Install dependencies (Alpine)
        run: apk add --no-cache nodejs npm gnupg
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
            node_modules
          key: ${{ matrix.typo3 }}-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ matrix.typo3 }}-${{ matrix.php }}-composer-
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE
      # CI-only alias until TYPO3 accepts the security-fixed svg-sanitize ^1.0.
      - run: composer require "enshrined/svg-sanitize:1.0.0 as 0.22.99" --dev --no-update --sort-packages --no-interaction
      - run: composer switchto${{ matrix.typo3 }}
      - run: bash tests/typo3-svg-sanitizer.sh
      - run: ./vendor/bin/grumphp run --ansi --no-interaction
      - run: composer test
      - name: Generate coverage report
        if: matrix.php == '83' && matrix.typo3 == '14'
        run: ./vendor/bin/phpunit --coverage-clover coverage.xml
        env:
          XDEBUG_MODE: coverage
      - name: Upload coverage to Codecov
        if: ${{ matrix.php == '83' && matrix.typo3 == '14' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: andersundsehr/lucene-cache
          files: coverage.xml
          continue-on-error: true
          fail_ci_if_error: false
